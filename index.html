<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluaciones WhatsApp · Ferremayoreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FE8301; --yellow:#FFED02; --pink:#ED8BFA; --black:#000;
    --gray:#EBEAE8; --soft-orange:#FFD9BA; --soft-yellow:#FFF3B8; --soft-pink:#F4CDF8;
    --muted:#575555; --bg:#FAF9F7; --card:#FFFFFF;
    --ok:#1E7A45; --ok-bg:#E4F4EA; --bad:#B42318; --bad-bg:#FDE8E6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--black);font:16px/1.55 Inter,Arial,system-ui,sans-serif}
  .brandbar{height:6px;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink))}
  .wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;font-size:14px}
  .logo i{width:14px;height:14px;border-radius:50%;background:var(--orange);display:inline-block}
  .client{font-size:13px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
  .tag::before{content:"";width:18px;height:2px;background:var(--orange)}
  h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:.3em 0 .4em}
  h1{font-size:clamp(28px,6vw,40px)}
  h2{font-size:22px}
  .lead{color:var(--muted);margin:0 0 24px}
  a{color:inherit}
  .card{background:var(--card);border:1px solid var(--black);border-radius:var(--radius);padding:20px}
  .grid{display:grid;gap:14px}
  .sess{display:flex;gap:16px;align-items:center;text-decoration:none;transition:transform .12s ease, box-shadow .12s ease}
  .sess:hover,.sess:focus-visible{transform:translateY(-2px);box-shadow:4px 4px 0 var(--orange);outline:none}
  .num{flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--soft-orange);display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:20px}
  .sess h3{margin:0 0 2px;font-size:17px}
  .sess p{margin:0;color:var(--muted);font-size:14px}
  .sess .go{margin-left:auto;font-weight:600;white-space:nowrap;font-size:14px}
  .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .back{display:inline-block;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:12px}
  .back:hover{color:var(--black)}
  label.field{display:block;font-weight:600;margin-bottom:6px}
  input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--black);border-radius:10px;background:#fff}
  input[type=text]:focus{outline:3px solid var(--soft-orange);outline-offset:1px}
  ol.qs{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:14px;counter-reset:q}
  .q{counter-increment:q}
  .q-text{font-weight:600;margin:0 0 12px}
  .q-text::before{content:counter(q) ". ";color:var(--orange);font-weight:700}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid #CFCDCA;border-radius:10px;cursor:pointer;background:#fff}
  .opt:hover{border-color:var(--black)}
  .opt input{margin:3px 0 0;accent-color:var(--orange);flex:0 0 auto;width:18px;height:18px}
  .opt:has(input:checked){border-color:var(--black);background:var(--soft-yellow)}
  .q.missing{border-color:var(--orange);box-shadow:0 0 0 3px var(--soft-orange)}
  .graded .opt{cursor:default}
  .graded .opt.is-correct{border-color:var(--ok);background:var(--ok-bg);border-width:2px}
  .graded .opt.is-wrong{border-color:var(--bad);background:var(--bad-bg);border-width:2px}
  .fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
  .fb.ok{background:var(--ok-bg)}
  .fb.bad{background:var(--bad-bg)}
  .fb b{display:block;margin-bottom:2px}
  .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
  .btn{font:inherit;font-weight:600;border:1px solid var(--black);background:var(--black);color:#fff;padding:12px 20px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--orange);border-color:var(--orange);color:#000}
  .btn.ghost{background:#fff;color:#000}
  .btn.ghost:hover{background:var(--soft-orange)}
  .progress{font-size:14px;color:var(--muted)}
  .msg{color:var(--bad);font-size:14px;font-weight:600}
  .score{margin-top:18px;text-align:center;background:linear-gradient(135deg,var(--soft-yellow),var(--soft-orange) 55%,var(--soft-pink))}
  .score .big{font-family:Fraunces,Georgia,serif;font-size:56px;font-weight:700;line-height:1}
  .score .big small{font-size:24px;color:var(--muted)}
  .score p{margin:8px 0 0}
  .score .who{font-size:14px;color:var(--muted)}
  .saved{font-size:13px;color:var(--muted);margin-top:6px}
  footer{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
  @media (max-width:520px){
    .sess{flex-wrap:wrap}
    .sess .go{margin-left:68px}
    .card{padding:16px}
  }
</style>
</head>

<script>

const SESIONES = [

{

    { q: "El tiempo de primera respuesta subió mucho esta semana. ¿Qué conviene revisar?",
      o: ["Cómo se están asignando las conversaciones y la carga de cada persona", "Los colores del panel", "Las plantillas rechazadas", "Nada, no es importante"],
      e: "Un aumento suele indicar conversaciones sin asignar o personas con demasiada carga." },
    { q: "Un vendedor tiene muchas conversaciones abiertas. ¿Qué puede significar?",
      o: ["Que tiene pendientes por atender o no está cerrando las que ya resolvió", "Que vendió más que nadie", "Que su número está desconectado", "Que Meta lo bloqueó"],
      e: "Vale la pena revisar con esa persona si son pendientes reales o conversaciones que solo falta cerrar." },
    { q: "¿Dónde se encuentra el panel «WhatsApp Ferremayoreo»?",
      o: ["En Informes > Paneles", "En la configuración de WhatsApp", "En la ficha de cada contacto", "En el teléfono"],
      e: "Los paneles reúnen varios reportes en una sola vista, dentro de la sección de Informes." },
    { q: "¿Cómo ves en el panel solo lo que pasó la semana pasada?",
      o: ["Con el filtro de fechas del panel", "Borrando las conversaciones anteriores", "Creando un panel nuevo cada semana", "No se puede"],
      e: "El filtro de fechas cambia el periodo de todos los reportes del panel a la vez." },
    { q: "¿Cómo puede recibir el equipo el panel sin tener que entrar a buscarlo?",
      o: ["Programando el envío del panel por correo", "Imprimiéndolo cada lunes", "Pidiéndoselo por WhatsApp a un cliente", "No se puede compartir"],
      e: "Al programar el envío, el panel llega por correo con la frecuencia que se elija." }
  ]
}
];

/* ============================ Lógica ============================ */
const app = document.getElementById("app");
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function shuffle(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const header = `
  <header class="top">
    <div class="logo"><i></i>Black &amp; Orange</div>
    <div class="client">Ferremayoreo Elizondo · WhatsApp en HubSpot</div>
  </header>`;
const footer = `<footer>Capacitaciones WhatsApp en HubSpot · Black &amp; Orange</footer>`;

function renderHome(){
  document.title = "Evaluaciones WhatsApp · Ferremayoreo";
  app.innerHTML = header + `
    <span class="tag">Evaluaciones</span>
    <h1>¿Qué tanto aprendimos?</h1>
    <p class="lead">Al terminar cada sesión, eliges la evaluación que corresponde, respondes 10 preguntas y al final ves tu calificación con las respuestas explicadas.</p>
    <div class="grid">
      ${SESIONES.map((s, i) => `
        <a class="card sess" href="?sesion=${i + 1}">
          <span class="num">${pad(i + 1)}</span>
          <div>
            <h3>${esc(s.titulo)}</h3>
            <p>${esc(s.resumen)}</p>
            <div class="meta">${s.preguntas.length} preguntas · 5 min aprox.</div>
          </div>
          <span class="go">Empezar →</span>
        </a>`).join("")}
    </div>` + footer;
}

function renderQuiz(idx){
  const s = SESIONES[idx];
  document.title = `Sesión ${pad(idx + 1)} · ${s.titulo} · Evaluación`;
  // Cada pregunta guarda sus opciones revueltas y cuál es la correcta.
  const qs = s.preguntas.map(p => ({ ...p, opts: shuffle(p.o.map((t, k) => ({ t, ok: k === 0 }))) }));

  app.innerHTML = header + `
    <a class="back" href="./">← Todas las sesiones</a><br>
    <span class="tag">Sesión ${pad(idx + 1)}</span>
    <h1>${esc(s.titulo)}</h1>
    <p class="lead">Para cada pregunta, eliges la opción que consideres correcta. Al final ves tu calificación y la explicación de cada respuesta.</p>
    <form id="quiz" novalidate>
      <div class="card">
        <label class="field" for="nombre">Tu nombre</label>
        <input type="text" id="nombre" autocomplete="name" placeholder="Nombre y apellido">
      </div>
      <div id="result"></div>
      <ol class="qs">
        ${qs.map((p, i) => `
          <li class="card q" id="q${i}">
            <p class="q-text">${esc(p.q)}</p>
            <div class="opts">
              ${p.opts.map((o, k) => `
                <label class="opt"><input type="radio" name="q${i}" value="${k}"><span>${esc(o.t)}</span></label>`).join("")}
            </div>
            <div class="fb" hidden></div>
          </li>`).join("")}
      </ol>
      <div class="actions" id="actions">
        <button class="btn" type="submit">Ver mi calificación</button>
        <span class="progress" id="progress">0 de ${qs.length} respondidas</span>
        <span class="msg" id="msg" role="alert"></span>
      </div>
    </form>` + footer;

  const form = document.getElementById("quiz");
  const progress = document.getElementById("progress");
  const msg = document.getElementById("msg");
  const answered = () => qs.filter((_, i) => form.querySelector(`input[name=q${i}]:checked`)).length;

  form.addEventListener("change", e => {
    progress.textContent = `${answered()} de ${qs.length} respondidas`;
    const li = e.target.closest(".q"); if (li) li.classList.remove("missing");
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const nombre = document.getElementById("nombre").value.trim();
    form.querySelectorAll(".q").forEach(li => li.classList.remove("missing"));
    if (!nombre) { msg.textContent = "Para ver tu calificación, primero escribes tu nombre."; document.getElementById("nombre").focus(); return; }
    const faltan = qs.map((_, i) => i).filter(i => !form.querySelector(`input[name=q${i}]:checked`));
    if (faltan.length) {
      faltan.forEach(i => document.getElementById("q" + i).classList.add("missing"));
      msg.textContent = faltan.length === 1 ? "Falta 1 pregunta por responder." : `Faltan ${faltan.length} preguntas por responder.`;
      document.getElementById("q" + faltan[0]).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    msg.textContent = "";

    let aciertos = 0; const detalle = [];
    qs.forEach((p, i) => {
      const li = document.getElementById("q" + i);
      const elegida = +form.querySelector(`input[name=q${i}]:checked`).value;
      const ok = p.opts[elegida].ok;
      if (ok) aciertos++;
      detalle.push(ok ? "✔" : "✘");
      li.querySelectorAll(".opt").forEach((lab, k) => {
        if (p.opts[k].ok) lab.classList.add("is-correct");
        else if (k === elegida) lab.classList.add("is-wrong");
      });
      const fb = li.querySelector(".fb");
      const correcta = p.opts.find(o => o.ok).t;
      fb.className = "fb " + (ok ? "ok" : "bad");
      fb.innerHTML = ok ? `<b>✓ Correcto</b>${esc(p.e)}` : `<b>✗ La respuesta correcta es: ${esc(correcta)}</b>${esc(p.e)}`;
      fb.hidden = false;
    });
    form.classList.add("graded");
    form.querySelectorAll("input").forEach(inp => inp.disabled = true);

    const total = qs.length;
    const frase = aciertos === total ? "¡Excelente! Dominas los temas de esta sesión."
      : aciertos >= 8 ? "¡Muy bien! Abajo puedes repasar las que se escaparon."
      : aciertos >= 6 ? "Vas bien. Te sugerimos repasar las explicaciones de abajo."
      : "Buen primer intento. Con la presentación a la mano puedes repasar y volver a intentarlo cuando gustes.";
    const fecha = new Date().toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "short" });

    document.getElementById("result").innerHTML = `
      <div class="card score" id="score">
        <span class="tag">Tu calificación</span>
        <div class="big">${aciertos}<small> / ${total}</small></div>
        <p>${frase}</p>
        <p class="who">${esc(nombre)} · Sesión ${pad(idx + 1)} · ${fecha}</p>
        <p class="saved" id="saved"></p>
      </div>`;
    document.getElementById("actions").innerHTML = `
      <a class="btn" href="?sesion=${idx + 1}">Intentar de nuevo</a>
      <a class="btn ghost" href="./">Ver otras sesiones</a>`;
    document.getElementById("score").scrollIntoView({ behavior: "smooth", block: "start" });

    if (SHEET_URL) {
      const saved = document.getElementById("saved");
      saved.textContent = "Guardando tu resultado…";
      fetch(SHEET_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ sesion: `${pad(idx + 1)} · ${s.titulo}`, nombre, aciertos, total, detalle })
      }).then(() => { saved.textContent = "Tu resultado quedó registrado."; })
        .catch(() => { saved.textContent = "No se pudo registrar el resultado. Para tenerlo a la mano, puedes tomar una captura de esta pantalla."; });
    }
  });
}

const n = parseInt(new URLSearchParams(location.search).get("sesion"), 10);
if (n >= 1 && n <= SESIONES.length) renderQuiz(n - 1); else renderHome();
</script>
</body>
</html>
